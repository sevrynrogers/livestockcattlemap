<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livestock Distribution - South Texas, Mexico & Guatemala</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    #map { height: 100vh; width: 100%; z-index: 10; }
    .leaflet-popup-content-wrapper { border-radius: 0.75rem; padding: 0.25rem; }
    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans overflow-hidden">

  <!-- Top App Bar -->
  <header class="absolute top-0 left-0 right-0 z-20 bg-slate-900/90 backdrop-blur border-b border-slate-700/60 px-5 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-lg bg-emerald-600 flex items-center justify-center font-bold text-white shadow-md">
        <i data-lucide="layers" class="w-5 h-5"></i>
      </div>
      <div>
        <h1 class="text-base font-bold text-slate-100 leading-tight">North American Livestock Corridor</h1>
        <p class="text-xs text-slate-400">South Texas • Mexico • Guatemala Cattle Distribution</p>
      </div>
    </div>
    <div class="flex items-center space-x-3 text-xs">
      <span class="hidden sm:inline-flex px-2.5 py-1 rounded-full bg-slate-800 border border-slate-700 text-slate-300">
        Estimated Herd: <strong class="ml-1 text-emerald-400" id="totalHeadCount">19.6M Head</strong>
      </span>
    </div>
  </header>

  <!-- Side Control / Detail Panel -->
  <aside class="absolute top-16 left-4 bottom-4 z-20 w-80 md:w-96 bg-slate-900/95 backdrop-blur-md border border-slate-700/70 rounded-xl shadow-2xl flex flex-col overflow-hidden">
    <!-- Filter Controls -->
    <div class="p-4 border-b border-slate-800 space-y-3 bg-slate-950/40">
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Country / Sub-Region</label>
        <select id="countryFilter" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <option value="ALL">All Regions (TX, MX, GT)</option>
          <option value="US">South Texas (United States)</option>
          <option value="MX">Mexico (North, Bajío, Gulf, South)</option>
          <option value="GT">Guatemala (Petén, Pacific, Highlands)</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Production System</label>
        <select id="systemFilter" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <option value="ALL">All Systems</option>
          <option value="Rangeland Beef">Rangeland Beef / Cow-Calf</option>
          <option value="Intensive Dairy/Feedlot">Intensive Dairy & Feedlots</option>
          <option value="Tropical Dual-Purpose">Tropical Dual-Purpose (Meat/Milk)</option>
          <option value="Smallholder Mixed">Smallholder & Highland Pastoral</option>
        </select>
      </div>
    </div>

    <!-- Active Region Profile -->
    <div id="regionDetail" class="flex-1 p-5 overflow-y-auto space-y-4">
      <div class="text-center py-8 text-slate-400 text-sm">
        <i data-lucide="map-pin" class="w-8 h-8 mx-auto mb-2 opacity-50 text-emerald-400"></i>
        Click on any production hub on the map to inspect herd demographics, pasture traits, and breeds.
      </div>
    </div>

    <!-- Map Legend Footer -->
    <div class="p-3 bg-slate-950/70 border-t border-slate-800 text-[11px] text-slate-400 space-y-1.5">
      <div class="font-semibold text-slate-300">Hub Bubble Scale:</div>
      <div class="flex items-center space-x-3">
        <span class="inline-flex items-center"><span class="w-2.5 h-2.5 rounded-full bg-emerald-400 mr-1.5"></span> &lt; 1.0M</span>
        <span class="inline-flex items-center"><span class="w-3.5 h-3.5 rounded-full bg-emerald-400 mr-1.5"></span> 1M - 3M</span>
        <span class="inline-flex items-center"><span class="w-5 h-5 rounded-full bg-emerald-400 mr-1.5"></span> &gt; 3.5M Head</span>
      </div>
    </div>
  </aside>

  <!-- Map Container -->
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    // Initialize Leaflet Map centered on the corridor
    const map = L.map('map', {
      center: [22.5, -97.5],
      zoom: 5,
      zoomControl: false
    });

    // Reposition zoom control to top right
    L.control.zoom({ position: 'topright' }).addTo(map);

    // 1. Accurate Basemap Layers
    const esriTopo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ, TomTom, Intermap, iPC, USGS, FAO, NPS, NRCAN, GeoBase, Kadaster NL, Ordnance Survey'
    });

    const openStreetMap = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    });

    const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
    });

    // Set Esri Topo as default accurate map
    esriTopo.addTo(map);

    // Basemap Switcher Control
    const baseMaps = {
      "Accurate Topographic (Esri)": esriTopo,
      "Street & Borders (OpenStreetMap)": openStreetMap,
      "High-Res Satellite (Esri Imagery)": esriSatellite
    };
    L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

    // Regional Livestock Dataset
    const livestockData = [
      {
        id: "tx-plains",
        name: "South Texas Plains & Coastal Brush",
        country: "US",
        lat: 27.5,
        lng: -98.2,
        headCount: 1.2,
        system: "Rangeland Beef",
        primaryBreed: "Beefmaster, Santa Gertrudis, Brahman crosses",
        forage: "Buffelgrass, Coastal Bermudagrass, native brush",
        details: "Extensive cow-calf operations situated across large historic ranches (King Ranch, Kenedy Ranch). Breeds are selected for extreme heat and parasite resistance."
      },
      {
        id: "mx-north",
        name: "Northern Mexico Desert & Rangelands",
        country: "MX",
        lat: 28.5,
        lng: -103.5,
        headCount: 4.8,
        system: "Rangeland Beef",
        primaryBreed: "Brangus, Charolais, Hereford, Angus crosses",
        forage: "Bouteloua grama grasses, desert shrub rangelands",
        details: "Major exporter of feeder calves directly to Texas feedlots via land ports like Laredo, Eagle Pass, and Presidio. Focus on high-quality export beef genetics."
      },
      {
        id: "mx-bajio",
        name: "Los Altos de Jalisco & El Bajío",
        country: "MX",
        lat: 20.8,
        lng: -102.5,
        headCount: 3.9,
        system: "Intensive Dairy/Feedlot",
        primaryBreed: "Holstein-Friesian, Jersey, Commercial Crosses",
        forage: "Silage corn, alfalfa, intensive total mixed rations",
        details: "Mexico's primary dairy basin and intensive swine/poultry belt. Characterized by high-capital confinement barns, milking parlors, and processing plants."
      },
      {
        id: "mx-gulf",
        name: "Veracruz Coast & Papaloapan Basin",
        country: "MX",
        lat: 19.1,
        lng: -96.3,
        headCount: 4.3,
        system: "Tropical Dual-Purpose",
        primaryBreed: "Zebu (Gyr, Guzerát), Brown Swiss crosses",
        forage: "Guinea grass, Pangola, Brachiaria humidicola",
        details: "Humid tropical climate. Operates on a dual-purpose system producing daily raw milk for regional cheese alongside tropical steers for pasture fattening."
      },
      {
        id: "mx-south",
        name: "Tabasco & Chiapas Savannas",
        country: "MX",
        lat: 17.2,
        lng: -92.8,
        headCount: 3.1,
        system: "Tropical Dual-Purpose",
        primaryBreed: "Brahman, Indubrasil, Nelore, Simbrah",
        forage: "African star grass, flooded tropical savannas",
        details: "Abundant rainfall and floodplains. Grazing systems are resilient to standing water and high relative humidity."
      },
      {
        id: "gt-peten",
        name: "El Petén Savannas & Forest Buffer",
        country: "GT",
        lat: 16.9,
        lng: -89.9,
        headCount: 1.1,
        system: "Tropical Dual-Purpose",
        primaryBreed: "Brahman, Simbrah, Brahman-Swiss cross",
        forage: "Brachiaria brizantha, naturalized savannas",
        details: "Guatemala's largest cattle department. Beef calves are finished on extensive pastureland and moved southward toward urban processing hubs."
      },
      {
        id: "gt-pacific",
        name: "Pacific Coastal Plain (Escuintla / Santa Rosa)",
        country: "GT",
        lat: 14.3,
        lng: -90.8,
        headCount: 0.8,
        system: "Tropical Dual-Purpose",
        primaryBreed: "Pardo Suizo (Brown Swiss), Brahman crosses",
        forage: "Jaragua, Star grass, agricultural byproducts",
        details: "Supplies fresh milk and dairy products directly to Guatemala City. High land competition with sugarcane and palm oil."
      },
      {
        id: "gt-highlands",
        name: "Western Highlands (Altiplano)",
        country: "GT",
        lat: 15.3,
        lng: -91.5,
        headCount: 0.4,
        system: "Smallholder Mixed",
        primaryBreed: "Criollo cattle, Criollo sheep, dairy goats",
        forage: "High-altitude browse, crop residues, roadside grazing",
        details: "Fragmented indigenous smallholder systems. Livestock provides household nutrition, draft power, and organic fertilizer on steep volcanic slopes."
      }
    ];

    let markerLayerGroup = L.layerGroup().addTo(map);

    function getBubbleRadius(headCount) {
      return Math.sqrt(headCount) * 14;
    }

    function renderDetailCard(item) {
      const container = document.getElementById('regionDetail');
      container.innerHTML = `
        <div class="space-y-3">
          <div class="border-b border-slate-700/80 pb-2">
            <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 uppercase">
              ${item.country === 'US' ? 'United States' : item.country === 'MX' ? 'Mexico' : 'Guatemala'}
            </span>
            <h2 class="text-base font-bold text-white mt-1.5 leading-snug">${item.name}</h2>
          </div>

          <div class="grid grid-cols-2 gap-2 text-xs">
            <div class="p-2.5 bg-slate-800/80 rounded-lg border border-slate-700/50">
              <span class="text-slate-400 block text-[10px] uppercase">Herd Size</span>
              <span class="text-base font-extrabold text-emerald-400">${item.headCount}M Head</span>
            </div>
            <div class="p-2.5 bg-slate-800/80 rounded-lg border border-slate-700/50">
              <span class="text-slate-400 block text-[10px] uppercase">System</span>
              <span class="text-xs font-semibold text-slate-200 mt-1 block">${item.system}</span>
            </div>
          </div>

          <div class="text-xs space-y-2">
            <div>
              <strong class="text-slate-300 block mb-0.5">Primary Breeds:</strong>
              <p class="text-slate-400 bg-slate-800/40 p-2 rounded border border-slate-800">${item.primaryBreed}</p>
            </div>
            <div>
              <strong class="text-slate-300 block mb-0.5">Forage & Feed:</strong>
              <p class="text-slate-400 bg-slate-800/40 p-2 rounded border border-slate-800">${item.forage}</p>
            </div>
            <div>
              <strong class="text-slate-300 block mb-0.5">Regional Dynamics:</strong>
              <p class="text-slate-300/90 leading-relaxed">${item.details}</p>
            </div>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function updateMap() {
      markerLayerGroup.clearLayers();
      const countryVal = document.getElementById('countryFilter').value;
      const systemVal = document.getElementById('systemFilter').value;

      let filtered = livestockData.filter(d => {
        const matchCountry = (countryVal === 'ALL' || d.country === countryVal);
        const matchSystem = (systemVal === 'ALL' || d.system === systemVal);
        return matchCountry && matchSystem;
      });

      // Update total counter
      const total = filtered.reduce((acc, curr) => acc + curr.headCount, 0).toFixed(1);
      document.getElementById('totalHeadCount').innerText = `${total}M Head`;

      filtered.forEach(item => {
        const marker = L.circleMarker([item.lat, item.lng], {
          radius: getBubbleRadius(item.headCount),
          fillColor: '#10b981',
          fillOpacity: 0.65,
          color: '#ffffff',
          weight: 1.5
        });

        marker.bindTooltip(`<strong>${item.name}</strong><br>${item.headCount}M Head (${item.system})`, {
          direction: 'top',
          className: 'text-xs'
        });

        marker.on('click', () => {
          map.flyTo([item.lat, item.lng], 7, { duration: 1 });
          renderDetailCard(item);
        });

        markerLayerGroup.addLayer(marker);
      });
    }

    document.getElementById('countryFilter').addEventListener('change', updateMap);
    document.getElementById('systemFilter').addEventListener('change', updateMap);

    // Initial render
    updateMap();
    lucide.createIcons();
  </script>
</body>
</html>
